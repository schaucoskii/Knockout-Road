<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knockout Road</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;
--bg:#e9ecef;--sf:#fff;--tx:#14213d;--mu:#5c6577;--rd:#d62839;--bl:#1f4e9c;--gd:#c98f10;--bd:#cfd4dc;--ok:#1f8a4c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--sf:#16203a;--tx:#eef0f2;--mu:#98a2b8;--rd:#ff4a5c;--bl:#6aa0ff;--gd:#f0b429;--bd:#2a3656;--ok:#4cc884}}
:root[data-theme="dark"]{--bg:#0d1424;--sf:#16203a;--tx:#eef0f2;--mu:#98a2b8;--rd:#ff4a5c;--bl:#6aa0ff;--gd:#f0b429;--bd:#2a3656;--ok:#4cc884}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em;margin:0 0 8px}
h1{font-size:2.6rem;line-height:1}h2{font-size:1.5rem}h3{font-size:1.1rem}
main{max-width:820px;margin:0 auto;padding:14px} .hero{background:linear-gradient(135deg,var(--tx),color-mix(in srgb,var(--tx) 78%,var(--bl)));padding:26px 20px;border-radius:16px;box-shadow:0 8px 24px rgba(10,20,40,.12)} .hero p{max-width:620px} .tabs{position:sticky;top:0;z-index:5;padding:8px 0;background:var(--bg)} .tabs button{border-radius:999px} .chip{border:1px solid var(--bd)} .progress{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin:6px 0 10px}.progress i{display:block;height:100%;background:var(--rd)} .style-info{padding:10px 12px;background:var(--bg);border-radius:9px;margin:8px 0} .subhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap} .table-wrap{overflow-x:auto} table tr:hover{background:color-mix(in srgb,var(--bl) 7%,transparent)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(10,20,40,.045)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.chip{background:var(--bg);border-radius:6px;padding:4px 9px;font-weight:600}
.mu{color:var(--mu);font-size:.9rem}
button{font:inherit;font-weight:600;border:2px solid var(--tx);background:transparent;color:var(--tx);border-radius:8px;padding:9px 13px;cursor:pointer}
button:hover:not(:disabled){background:var(--tx);color:var(--bg)}
button.pri{background:var(--rd);border-color:var(--rd);color:#fff}
button.pri:hover:not(:disabled){filter:brightness(1.1);background:var(--rd);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--bl)}.bar.r i{background:var(--rd)}.bar.g i{background:var(--gd)}
.stat{display:grid;grid-template-columns:72px 1fr 32px;gap:8px;align-items:center;margin:4px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
.tabs button.on{background:var(--tx);color:var(--bg)}
.msg{border-left:5px solid var(--gd);background:var(--sf);padding:10px 12px;margin-bottom:12px;border-radius:0 8px 8px 0}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:.95rem}
.next{background:color-mix(in srgb,var(--gd) 18%,transparent)}.done{color:var(--mu)}
.belt{background:var(--gd);color:#14213d;padding:2px 9px;border-radius:12px;font-weight:600}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.log{max-height:170px;overflow:auto;font-size:.95rem}.log p{margin:3px 0}
input,select{font:inherit;padding:9px;border:2px solid var(--tx);border-radius:8px;background:var(--sf);color:var(--tx);width:100%;margin:6px 0}
.hero{background:var(--tx);color:var(--bg);border-radius:10px;padding:22px 16px;margin-bottom:12px}
.hero h1 span{color:var(--rd)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
input[type=range]{padding:0;border:0;accent-color:var(--rd)}
.face{border-radius:10px;background:var(--bg);flex:none;display:block}
.clk{cursor:pointer;text-align:center}.clk .mu{display:block;font-size:.8rem}
.ov{user-select:none;position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:50}
.pm{background:var(--sf);border-radius:12px;padding:16px;max-width:460px;width:100%}
.offer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.offer{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:12px;min-width:0}.offer h4{margin:5px 0}.offer .mu{font-size:.88rem}.trait{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:3px 8px;font-size:.78rem;margin:3px 0}@media(max-width:650px){.offer-grid{grid-template-columns:1fr}}
button.on{background:var(--tx);color:var(--bg)}

/* Corner-gym visual refresh */
:root{color-scheme:light;--bg:#f1eee7;--sf:#fffdf8;--tx:#242321;--mu:#77736b;--rd:#bd382e;--bl:#315b59;--gd:#c9953b;--bd:#ded8cc;--ok:#397456}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171817;--sf:#222522;--tx:#f4f0e8;--mu:#aaa69c;--rd:#e45a4d;--bl:#80aaa2;--gd:#d9ad5c;--bd:#41443e;--ok:#79b792}}
body{font-family:"Barlow",Arial,sans-serif;background-image:radial-gradient(color-mix(in srgb,var(--tx) 5%,transparent) .65px,transparent .65px);background-size:6px 6px}
main{max-width:1000px;padding:20px 18px 50px}
.hero{position:relative;overflow:hidden;padding:32px 28px;border-radius:5px 18px 5px 18px;background:linear-gradient(115deg,#242321 0%,#39352e 70%,#5a322c 100%);box-shadow:0 12px 30px #1c17131c}
.hero:after{content:"";position:absolute;right:-28px;top:-42px;width:180px;height:180px;border:18px solid #ffffff0c;border-radius:50%;box-shadow:0 0 0 18px #ffffff08,0 0 0 36px #ffffff05;pointer-events:none}
.hero h1{font-size:clamp(2.7rem,7vw,4.3rem);letter-spacing:.015em;text-transform:uppercase}
.hero p{max-width:560px;color:#e1d9cc}
.card{border-radius:5px 14px 5px 14px;border-color:var(--bd);box-shadow:0 5px 18px #2b24140a;padding:18px}
.card h3,.card h2{letter-spacing:.04em;text-transform:uppercase}
button{border:1px solid var(--bd);border-radius:5px;background:var(--sf);transition:transform .12s ease,background .12s ease,border-color .12s ease}
button:hover:not(:disabled){background:var(--tx);border-color:var(--tx);color:var(--sf);transform:translateY(-1px)}
button.pri{background:var(--rd);border-color:var(--rd);box-shadow:0 3px 0 color-mix(in srgb,var(--rd) 70%,#000)}
button.pri:hover:not(:disabled){background:var(--rd);border-color:var(--rd);color:#fff;filter:brightness(1.07)}
.tabs{padding:8px 6px;border-bottom:1px solid var(--bd);gap:5px}
.tabs button{border:0;background:transparent;color:var(--mu);border-radius:4px;padding:10px 13px}
.tabs button.on{background:var(--tx);color:var(--sf)}
.chip{border-radius:4px;background:color-mix(in srgb,var(--bl) 9%,var(--sf));border-color:var(--bd);font-size:.88rem}
.progress{height:7px;background:color-mix(in srgb,var(--tx) 9%,var(--bg));border-radius:3px}
.progress i{background:var(--rd)}
.bar{border-radius:2px;background:color-mix(in srgb,var(--tx) 10%,var(--bg))}
.bar i{background:var(--bl)}
.bar.r i{background:var(--rd)}.bar.g i{background:var(--gd)}
.stat{margin:6px 0;grid-template-columns:86px 1fr 32px;font-size:.92rem}
.offer-grid{gap:12px}
.offer{border-radius:5px 12px 5px 12px;background:var(--sf);padding:15px;border-top:3px solid var(--bl)}
.offer:nth-child(2){border-top-color:var(--gd)}.offer:nth-child(3){border-top-color:var(--rd)}
.offer h4{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:1.25rem;letter-spacing:.03em}
.trait{border-radius:3px;background:var(--bg);border-color:var(--bd)}
.style-info{border-radius:4px;border-left:3px solid var(--gd);background:color-mix(in srgb,var(--gd) 8%,var(--sf))}
.msg{border-left-color:var(--rd);border-radius:3px 8px 8px 3px}
input,select{border:1px solid var(--bd);border-radius:4px}
input:focus,select:focus{border-color:var(--bl)}
table tr:hover{background:color-mix(in srgb,var(--bl) 7%,transparent)}
.belt{border-radius:3px;background:var(--gd);text-transform:uppercase;font-size:.78rem;letter-spacing:.05em}
.pm{border-radius:6px}
.level-panel{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:linear-gradient(120deg,color-mix(in srgb,var(--bl) 12%,var(--sf)),var(--sf));border:1px solid var(--bd);padding:16px;border-radius:5px 12px 5px 12px;margin-bottom:14px}
.level-number{font-family:Anton,Impact,sans-serif;font-size:2.2rem;line-height:1;color:var(--rd)}
.branch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.branch{border:1px solid var(--bd);border-radius:5px;padding:14px;background:var(--sf)}
.branch h4{margin:0 0 4px;font-family:Anton,Impact,sans-serif;font-size:1.15rem;font-weight:400;text-transform:uppercase}
.branch .rank{display:flex;gap:4px;margin:10px 0}
.branch .rank i{display:block;height:6px;flex:1;background:var(--bd);border-radius:1px}
.branch .rank i.filled{background:var(--bl)}
.ability-row{padding:11px 0;border-bottom:1px solid var(--bd)}
.ability-row:last-child{border-bottom:0}
@media(max-width:620px){main{padding:12px 10px 36px}.hero{padding:25px 18px}.card{padding:14px}.branch-grid{grid-template-columns:1fr}.level-panel{grid-template-columns:1fr}.stat{grid-template-columns:76px 1fr 28px}.tabs button{padding:9px 11px}}


/* KNOCKOUT ROAD — ringside management interface */
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{
  color-scheme:dark;
  --bg:#0b0d10;--sf:#14181e;--tx:#f1f3f5;--mu:#929ba7;
  --rd:#e14b43;--bl:#70a9a1;--gd:#d6ad62;--bd:#29313b;--ok:#70b68b;
}
body{
  font-family:'DM Sans',Arial,sans-serif;
  background:
    radial-gradient(ellipse at 78% -12%,rgba(214,173,98,.10),transparent 34rem),
    radial-gradient(ellipse at 4% 30%,rgba(112,169,161,.06),transparent 28rem),
    var(--bg);
  letter-spacing:.005em;
}
main{max-width:1320px;margin:0 auto;padding:26px 34px 70px}
#app:has(.tabs){padding-left:245px}
#app:has(.tabs) .tabs{
  position:fixed;z-index:20;top:22px;left:max(18px,calc((100vw - 1320px)/2 + 18px));
  width:196px;height:calc(100vh - 44px);max-height:860px;overflow:hidden;
  display:flex;flex-direction:column;align-items:stretch;gap:5px;
  padding:18px 12px;margin:0;border:1px solid #28313b;border-radius:15px;
  background:linear-gradient(180deg,#151a20 0%,#101419 100%);
  box-shadow:0 18px 60px #0008;
}
#app:has(.tabs) .tabs:before{
  content:'KNOCKOUT\A ROAD';white-space:pre;display:block;flex:none;
  padding:4px 10px 22px;margin:0 0 10px;border-bottom:1px solid var(--bd);
  color:var(--tx);font-family:'Barlow Condensed',sans-serif;font-size:27px;
  font-weight:800;line-height:.9;letter-spacing:.08em;
}
#app:has(.tabs) .tabs:after{
  content:'CAREER MANAGEMENT';display:block;margin:auto 8px 5px;padding-top:16px;
  border-top:1px solid var(--bd);color:#65717e;font-size:9px;font-weight:800;letter-spacing:.16em;
}
#app:has(.tabs) .tabs button{
  width:100%;text-align:left;white-space:normal;border:1px solid transparent;
  border-radius:8px;padding:12px 13px;background:transparent;color:#aab3bd;
  font-size:13px;font-weight:700;letter-spacing:.015em;transition:all .16s ease;
}
#app:has(.tabs) .tabs button:hover:not(:disabled){transform:translateX(2px);background:#202832;color:#fff;border-color:#303b47}
#app:has(.tabs) .tabs button.on{
  background:linear-gradient(90deg,rgba(214,173,98,.18),rgba(214,173,98,.045));
  color:#f1d39a;border-color:#695638;box-shadow:inset 3px 0 0 var(--gd);
}
.hero{
  border:1px solid #3b3b35;border-radius:16px;padding:38px 36px;
  background:linear-gradient(112deg,#171b20 0%,#242a30 58%,#3b3025 100%);
  box-shadow:0 18px 50px #0005;
}
.hero:after{right:5%;top:-80px;width:260px;height:260px;border-color:#d6ad6212;box-shadow:0 0 0 25px #d6ad6208,0 0 0 50px #d6ad6205}
.hero h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(3.2rem,7vw,5.4rem);font-weight:800;letter-spacing:.035em}
.hero h1 span{color:var(--gd)}
.hero p{color:#b8c0c9;font-size:15px;max-width:590px}
.card{
  background:linear-gradient(145deg,#171c22,#13171c);
  border:1px solid #2b333d;border-radius:12px;padding:20px;margin-bottom:16px;
  box-shadow:0 8px 24px #0002;
}
.card h2,.card h3,.hero h1,.offer h4,.branch h4,.level-number{
  font-family:'Barlow Condensed',Impact,sans-serif;
}
.card h3,.card h2{font-size:1.35rem;letter-spacing:.065em;color:#f0e6d4}
.card p{line-height:1.6}
.mu{color:#929ba7}
.chip{background:#202832;border:1px solid #35414d;color:#d6dce2;border-radius:5px;padding:5px 9px;font-size:12px}
.belt{background:linear-gradient(135deg,#e3c17b,#a77a35);color:#211a0d;border-radius:4px;font-weight:800}
button{
  border:1px solid #3a4652;background:#202730;color:#e7ebef;border-radius:7px;
  padding:10px 14px;font-size:13px;font-weight:700;transition:all .16s ease;
}
button:hover:not(:disabled){background:#303b46;border-color:#697785;color:#fff;transform:translateY(-1px)}
button.pri{background:linear-gradient(135deg,#d7ad63,#b8863c);border:1px solid #e6c783;color:#17130d;box-shadow:0 4px 14px #d6ad6228}
button.pri:hover:not(:disabled){background:linear-gradient(135deg,#e8c77f,#c7964b);color:#17130d}
button:disabled{opacity:.32}
input,select{background:#10151a;border:1px solid #35414d;color:#edf0f3;border-radius:7px;padding:11px}
input:focus,select:focus{border-color:var(--gd);outline:none;box-shadow:0 0 0 3px #d6ad6220}
.progress{background:#29313a;border-radius:20px;height:8px}
.progress i{background:linear-gradient(90deg,#bd443d,#e5b75e);border-radius:20px}
.bar{background:#29313a;border-radius:20px}
.bar i{background:linear-gradient(90deg,#4d817c,#83b9ae);border-radius:20px}
.bar.r i{background:linear-gradient(90deg,#a93335,#e15a4e)}
.bar.g i{background:linear-gradient(90deg,#9d7132,#e1bd72)}
.stat{grid-template-columns:100px 1fr 34px;margin:8px 0;font-size:12px;color:#c5ccd3}
.level-panel{background:linear-gradient(115deg,#1c292b,#171d22 65%,#2b241b);border:1px solid #354a47;border-radius:12px;padding:20px}
.level-number{font-size:2.8rem;color:var(--gd)}
.branch,.offer{background:#171d23;border:1px solid #303a44;border-radius:10px}
.offer{border-top:3px solid var(--bl);padding:17px}
.offer:nth-child(2){border-top-color:var(--gd)}.offer:nth-child(3){border-top-color:var(--rd)}
.offer h4{font-size:1.5rem;color:#f4ead8}
.trait{background:#222b33;border:1px solid #394550;border-radius:4px;color:#bfc9d1}
.style-info{background:#20272e;border-left:3px solid var(--gd);border-radius:5px}
.msg{background:#1d252c;border-left:4px solid var(--gd);border-radius:6px;color:#f0e6d4}
table{border-collapse:separate;border-spacing:0}
td,th{padding:11px 10px;border-bottom:1px solid #29313a;font-size:12px}
th{color:#8f9aa6;text-transform:uppercase;font-size:10px;letter-spacing:.12em}
table tr:hover{background:#202832}
.next{background:#293027}
.pm{background:#171d23;border:1px solid #38424c;border-radius:12px;box-shadow:0 25px 80px #000b}
.ov{background:#050709d9;backdrop-filter:blur(8px)}
.log{color:#b5bec8}
.face{border:1px solid #3b4650;background:#202730}
.subhead{margin-bottom:8px}
.belt{padding:4px 9px}
@media(max-width:900px){
  main{padding:18px 16px 45px}
  #app:has(.tabs){padding-left:0;padding-top:0}
  #app:has(.tabs) .tabs{
    position:sticky;top:0;left:auto;width:auto;height:auto;max-height:none;
    flex-direction:row;overflow-x:auto;align-items:center;gap:5px;
    margin:0 0 14px;padding:8px;background:#11161beF;border:1px solid #2b333d;
    border-radius:10px;backdrop-filter:blur(12px);
  }
  #app:has(.tabs) .tabs:before,#app:has(.tabs) .tabs:after{display:none}
  #app:has(.tabs) .tabs button{width:auto;flex:none;text-align:center;padding:10px 13px}
}
@media(max-width:620px){
  main{padding:12px 10px 34px}
  .hero{padding:26px 20px}
  .card{padding:15px}
  .stat{grid-template-columns:76px 1fr 28px}
  .offer-grid{grid-template-columns:1fr}
  .vs{grid-template-columns:1fr}
}


/* Five-axis fighter radar */
.fighter-overview{padding:0;overflow:hidden;background:linear-gradient(120deg,#171d23 0%,#12171c 65%,#1d211f 100%)}
.fighter-top{padding:20px 22px 16px;border-bottom:1px solid #303943;display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}
.fighter-id{display:flex;align-items:center;gap:16px;min-width:260px}
.fighter-id h2{font-size:1.8rem;margin:4px 0}
.eyebrow{font-size:9px;letter-spacing:.17em;color:#c8a86d;font-weight:800}
.fighter-tags,.fighter-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fighter-meta{justify-content:flex-end;max-width:480px}
.fighter-stats-layout{display:grid;grid-template-columns:minmax(300px,1.05fr) minmax(280px,.95fr);gap:18px;padding:18px 22px 22px}
.pentagon-panel{background:radial-gradient(ellipse at 50% 48%,#263039 0%,#1a2128 58%,#171c22 100%);border:1px solid #35414b;border-radius:11px;padding:14px 12px 8px}
.pentagon-panel .subhead{display:flex;justify-content:space-between;align-items:center}
.pentagon-panel h3,.attribute-bars h3{margin:0}
.pentagon-wrap{max-width:330px;margin:0 auto;position:relative}
.pentagon-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.radar-grid{fill:none;stroke:#53616d;stroke-width:1;opacity:.42}
.radar-grid.outer{stroke:#8c9aa5;opacity:.65}
.radar-axis{stroke:#52606b;stroke-width:1;opacity:.55}
.radar-area{fill:#c69c54;fill-opacity:.26;stroke:#e0b96f;stroke-width:2.4;stroke-linejoin:round;filter:drop-shadow(0 0 5px #d7ae5b55)}
.radar-dot{fill:#f1d18e;stroke:#25211a;stroke-width:1.2}
.radar-label{fill:#c6cdd3;font:800 9px 'DM Sans',sans-serif;letter-spacing:1.2px}
.radar-values{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:-2px;padding-bottom:5px}
.radar-values span{font-size:10px;color:#aeb8c1}
.radar-values b{color:#e1bf7c;margin-right:3px}
.attribute-bars{padding:14px 8px}
.attribute-bars .stat{grid-template-columns:88px minmax(60px,1fr) 28px;margin:15px 0}
@media(max-width:720px){
 .fighter-stats-layout{grid-template-columns:1fr;padding:14px}
 .fighter-top{padding:16px}
 .fighter-meta{justify-content:flex-start}
 .pentagon-wrap{max-width:290px}
}

/* ===== GAME HUD LAYER — console-style menus ===== */
:root{
  color-scheme:dark;
  --bg:#060709;--sf:#0f1216;--tx:#f4f5f7;--mu:#8a929c;
  --rd:#ff3d3d;--bl:#3ee0c8;--gd:#ffc43d;--bd:#ffffff14;--ok:#4ee38b;
  --panel:linear-gradient(160deg,rgba(26,30,37,.86),rgba(12,14,18,.92));
  --cut:14px;--cut-sm:8px;
  --hd:'Saira Condensed',Impact,sans-serif;--ui:'Saira',system-ui,sans-serif;
}
html,body{min-height:100%}
body{
  font-family:var(--ui);font-size:15px;color:var(--tx);
  background:
    radial-gradient(ellipse 60% 45% at 50% -8%,rgba(255,196,61,.16),transparent 70%),
    radial-gradient(ellipse 40% 60% at 100% 100%,rgba(255,61,61,.10),transparent 70%),
    radial-gradient(ellipse 40% 50% at 0% 70%,rgba(62,224,200,.06),transparent 70%),
    #060709;
  background-attachment:fixed;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
  mask:radial-gradient(ellipse at center,#000 30%,transparent 85%);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  box-shadow:inset 0 0 180px 40px #000;
}
input,select,textarea{-webkit-user-select:text;user-select:text}
::selection{background:var(--gd);color:#000}
*{scrollbar-width:thin;scrollbar-color:#ffffff22 transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ffffff22;border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--gd)}
img,svg{-webkit-user-drag:none}

main{position:relative;z-index:1;max-width:1360px;padding:28px 36px 80px}
#app > *{animation:hudIn .35s cubic-bezier(.2,.8,.2,1) both}
#app > *:nth-child(2){animation-delay:.03s}#app > *:nth-child(3){animation-delay:.06s}
#app > *:nth-child(4){animation-delay:.09s}#app > *:nth-child(n+5){animation-delay:.12s}
#app:has(.tabs) > .tabs{animation:none}
@keyframes hudIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#app > *{animation:none}}

/* Typography */
h1,h2,h3,h4,.card h2,.card h3,.offer h4,.branch h4,.level-number{
  font-family:var(--hd);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--tx);
}
.card h2,.card h3{font-size:1.25rem;letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.card > h2:first-child:before,.card > h3:first-child:before,.subhead h3:before,.subhead h2:before{
  content:"";width:4px;height:1em;background:var(--gd);transform:skewX(-18deg);flex:none;display:inline-block;margin-right:8px;vertical-align:-2px;
}
.mu{color:var(--mu)}
.eyebrow{font-family:var(--hd);color:var(--gd);font-size:11px;letter-spacing:.28em}

/* Hero = title screen banner */
.hero{
  position:relative;overflow:hidden;border:0;border-radius:0;padding:48px 44px 44px;margin-bottom:18px;
  background:
    linear-gradient(100deg,rgba(6,7,9,.96) 0%,rgba(6,7,9,.7) 55%,rgba(255,61,61,.25) 100%),
    repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px),
    #101318;
  clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,40px 100%,0 calc(100% - 40px));
  box-shadow:none;
}
.hero:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(180deg,var(--gd),var(--rd));
}
.hero:after{
  content:"";position:absolute;inset:auto -10% -60% auto;width:520px;height:520px;border:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,196,61,.18),transparent 60%);box-shadow:none;
}
.hero h1{font-family:var(--hd);font-size:clamp(3.4rem,8vw,6.4rem);font-weight:900;font-style:italic;line-height:.86;letter-spacing:.01em;margin-bottom:14px;text-shadow:0 6px 30px #000}
.hero h1 span{color:transparent;-webkit-text-stroke:2px var(--gd);display:inline-block}
.hero p{color:#aeb5bf;font-size:15px;max-width:560px;line-height:1.6}

/* Panels */
.card,.level-panel,.pm{
  position:relative;background:var(--panel);border:1px solid var(--bd);border-radius:0;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.card{padding:22px;margin-bottom:16px}
.card:before{
  content:"";position:absolute;left:0;top:0;width:60px;height:2px;background:var(--gd);
}
.card:hover{border-color:#ffffff22}
.level-panel{background:linear-gradient(110deg,rgba(255,196,61,.12),rgba(15,18,22,.9) 55%);padding:22px}
.level-number{font-size:3.4rem;font-style:italic;color:var(--gd);text-shadow:0 0 24px rgba(255,196,61,.35)}
.fighter-overview{padding:0;background:var(--panel)}
.fighter-top{border-bottom:1px solid var(--bd);background:linear-gradient(90deg,rgba(255,196,61,.07),transparent 60%)}
.fighter-id h2{font-size:2.2rem;font-style:italic;letter-spacing:.02em}
.pentagon-panel{border-radius:0;border:1px solid var(--bd);background:radial-gradient(circle at 50% 50%,rgba(255,196,61,.08),rgba(0,0,0,.25) 70%)}
.radar-area{fill:var(--gd);fill-opacity:.22;stroke:var(--gd);filter:drop-shadow(0 0 10px rgba(255,196,61,.5))}
.radar-dot{fill:#fff;stroke:var(--gd);stroke-width:2}
.radar-grid{stroke:#ffffff;opacity:.08}.radar-grid.outer{opacity:.22}
.radar-axis{stroke:#ffffff;opacity:.1}
.radar-label{fill:#d3d8de;font:700 10px var(--hd);letter-spacing:2px}
.radar-values b{color:var(--gd)}

.offer,.branch{
  background:rgba(0,0,0,.28);border:1px solid var(--bd);border-radius:0;position:relative;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
}
.offer{border-top:0;padding:18px 18px 16px;box-shadow:inset 0 3px 0 var(--bl)}
.offer:nth-child(2){box-shadow:inset 0 3px 0 var(--gd)}.offer:nth-child(3){box-shadow:inset 0 3px 0 var(--rd)}
.offer:hover,.branch:hover{transform:translateY(-3px);border-color:#ffffff30;background:rgba(255,255,255,.03)}
.offer h4{font-size:1.6rem;font-style:italic}
.branch .rank i{height:5px;border-radius:0;transform:skewX(-20deg);background:#ffffff14}
.branch .rank i.filled{background:var(--gd);box-shadow:0 0 8px rgba(255,196,61,.5)}

/* Buttons = game prompts */
button{
  position:relative;font-family:var(--hd);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#e6e9ed;background:rgba(255,255,255,.05);border:1px solid #ffffff1f;border-radius:0;padding:11px 18px;
  clip-path:polygon(var(--cut-sm) 0,100% 0,100% calc(100% - var(--cut-sm)),calc(100% - var(--cut-sm)) 100%,0 100%,0 var(--cut-sm));
  transition:background .15s ease,color .15s ease,border-color .15s ease,transform .1s ease;
}
button:hover:not(:disabled){background:#fff;border-color:#fff;color:#000;transform:none}
button:active:not(:disabled){transform:scale(.97)}
button.pri{
  background:linear-gradient(90deg,var(--gd),#ffd877);border:1px solid var(--gd);color:#0a0a0a;box-shadow:none;
}
button.pri:after{content:"\203A";margin-left:10px;font-size:1.25em;line-height:0;display:inline-block;transition:transform .15s ease}
button.pri:hover:not(:disabled){background:#fff;border-color:#fff;color:#000;filter:none}
button.pri:hover:not(:disabled):after{transform:translateX(4px)}
button:disabled{opacity:.28}
button.on{background:var(--gd);border-color:var(--gd);color:#000}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gd);outline-offset:3px}

/* Nav rail */
#app:has(.tabs){padding-left:250px}
#app:has(.tabs) .tabs{
  top:28px;width:210px;height:calc(100vh - 56px);padding:22px 0 18px;gap:2px;border:0;border-radius:0;
  background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.25));
  border-right:1px solid var(--bd);box-shadow:none;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
#app:has(.tabs) .tabs:before{
  font-family:var(--hd);font-size:34px;font-weight:900;font-style:italic;letter-spacing:.02em;line-height:.82;
  padding:0 22px 22px;margin:0 0 14px;border-bottom:1px solid var(--bd);
  background:linear-gradient(180deg,#fff 40%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent;
}
#app:has(.tabs) .tabs:after{font-family:var(--hd);margin:auto 22px 0;color:#ffffff40;letter-spacing:.3em;font-size:10px}
#app:has(.tabs) .tabs button{
  clip-path:none;border:0;border-radius:0;background:transparent;color:#7f8893;
  padding:13px 22px;font-size:15px;letter-spacing:.14em;
}
#app:has(.tabs) .tabs button:hover:not(:disabled){background:rgba(255,255,255,.05);color:#fff;transform:translateX(4px);border:0}
#app:has(.tabs) .tabs button.on{
  color:#000;background:linear-gradient(90deg,var(--gd),rgba(255,196,61,.75) 70%,transparent);
  box-shadow:none;border:0;font-style:italic;
}

/* Chips / badges */
.chip{
  font-family:var(--hd);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.05);border:1px solid #ffffff1a;color:#d7dbe0;border-radius:0;padding:5px 10px;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
}
.trait{border-radius:0;background:rgba(255,255,255,.04);border:1px solid #ffffff18;font-family:var(--hd);letter-spacing:.08em;text-transform:uppercase}
.belt{
  font-family:var(--hd);font-weight:800;letter-spacing:.14em;border-radius:0;padding:4px 12px;color:#1a1204;
  background:linear-gradient(90deg,#ffe08a,var(--gd) 50%,#c98f10);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);
}

/* Meters */
.progress,.bar{height:6px;border-radius:0;background:rgba(255,255,255,.07);overflow:hidden;transform:skewX(-20deg)}
.progress i{border-radius:0;background:linear-gradient(90deg,var(--rd),var(--gd));box-shadow:0 0 12px rgba(255,196,61,.5)}
.bar i{border-radius:0;background:linear-gradient(90deg,#1a9f8c,var(--bl));box-shadow:0 0 10px rgba(62,224,200,.4)}
.bar.r i{background:linear-gradient(90deg,#b31d1d,var(--rd));box-shadow:0 0 10px rgba(255,61,61,.4)}
.bar.g i{background:linear-gradient(90deg,#c98f10,var(--gd));box-shadow:0 0 10px rgba(255,196,61,.4)}
.stat{font-family:var(--hd);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#bfc5cc}
.stat > :last-child{font-weight:800;color:#fff;text-align:right}

/* Messages / info */
.msg{
  border:0;border-left:3px solid var(--gd);border-radius:0;color:#f3e7c9;
  background:linear-gradient(90deg,rgba(255,196,61,.14),transparent 80%);padding:12px 16px;
  font-family:var(--hd);font-size:15px;letter-spacing:.04em;
}
.style-info{border-radius:0;border-left:2px solid var(--bl);background:linear-gradient(90deg,rgba(62,224,200,.08),transparent)}

/* Forms — no native look */
input,select{
  appearance:none;-webkit-appearance:none;border-radius:0;background:rgba(0,0,0,.4);
  border:0;border-bottom:2px solid #ffffff22;color:#fff;padding:11px 12px;font-family:var(--ui);
  transition:border-color .15s ease,background .15s ease;
}
input:focus,select:focus{outline:none;border-color:var(--gd);background:rgba(255,196,61,.06);box-shadow:none}
select{
  padding-right:34px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--gd) 50%),linear-gradient(135deg,var(--gd) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;
}
select option{background:#0f1216;color:#fff}
input[type=range]{height:22px;background:transparent;border:0;padding:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--gd),#ffffff22);}
input[type=range]::-moz-range-track{height:4px;background:#ffffff22}
input[type=range]::-moz-range-progress{height:4px;background:var(--gd)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:18px;margin-top:-7px;background:#fff;border:0;clip-path:polygon(30% 0,100% 0,70% 100%,0 100%)}
input[type=range]::-moz-range-thumb{width:14px;height:18px;background:#fff;border:0;border-radius:0}

/* Tables = leaderboards */
.table-wrap{border:1px solid var(--bd)}
th{font-family:var(--hd);font-size:11px;letter-spacing:.2em;color:#6f7782;background:rgba(0,0,0,.3);border-bottom:1px solid var(--bd)}
td{font-size:13px;border-bottom:1px solid #ffffff0a}
table tr:hover{background:rgba(255,255,255,.035)}
.next{background:linear-gradient(90deg,rgba(255,196,61,.16),transparent)!important;box-shadow:inset 3px 0 0 var(--gd)}

/* Overlays */
.ov{background:rgba(2,3,4,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pm{padding:24px;animation:hudIn .25s ease both}
.face{border:1px solid #ffffff22;border-radius:0;background:rgba(0,0,0,.35);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.log p{padding:4px 0 4px 10px;border-left:1px solid #ffffff14;margin:0}
.log p:first-child{border-left-color:var(--gd);color:#fff}

@media(max-width:900px){
  main{padding:16px 14px 60px}
  #app:has(.tabs){padding-left:0}
  #app:has(.tabs) .tabs{
    position:sticky;top:0;height:auto;width:auto;padding:6px;margin:0 -14px 16px;
    border:0;border-bottom:1px solid var(--bd);background:rgba(6,7,9,.85);
  }
  #app:has(.tabs) .tabs button{padding:10px 14px;font-size:13px}
  #app:has(.tabs) .tabs button.on{background:var(--gd)}
  .hero{padding:34px 24px 30px;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px))}
}
@media(max-width:620px){
  .card{padding:16px}
  .hero h1{font-size:3.2rem}
}

/* Native Knockout Road launch screen, migrated from the MagicPath prototype */
body.kr-at-menu{background:#080c13;background-image:radial-gradient(ellipse at 50% 22%,#222d3d 0%,#0e1520 55%,#070a10 100%);}
body.kr-at-menu main{max-width:none;padding:0;min-height:100vh}
.kr-shell{min-height:100vh;display:flex;flex-direction:column;font-family:"Saira",system-ui,sans-serif;color:#f4f6fa;--menu-accent:#e9b949;--menu-space:1}
.kr-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(18px,4vw,55px);border-bottom:1px solid #ffffff18}

.kr-logo em{font-style:inherit;color:var(--menu-accent)}
.kr-mode{display:inline-flex;align-items:center;gap:9px;border:1px solid #315b49;background:#14251f;padding:10px 14px;color:#9de3b6;font-size:11px;font-weight:800;letter-spacing:.13em}

.kr-title span{color:var(--menu-accent)}
.kr-intro{max-width:490px;margin:32px auto 35px;color:#b5bdca;line-height:1.65;font-size:14px}
.kr-menu-actions{display:flex;flex-direction:column;gap:13px;width:min(420px,100%)}
.kr-shell button.kr-action{width:100%;min-height:66px;display:flex;align-items:center;justify-content:center;gap:12px;background:#1c2838;border:1px solid #586479;border-radius:9px;clip-path:none;color:#f4f6fa;font-family:"Saira Condensed",Impact,sans-serif;font-style:italic;font-weight:800;font-size:23px;letter-spacing:.075em;transition:transform .15s,background .15s}
.kr-shell button.kr-action:hover{background:#303d4e;color:white;transform:translateY(-2px)}
.kr-shell button.kr-action.kr-primary{background:var(--menu-accent);border-color:var(--menu-accent);color:#101318;font-size:27px;min-height:77px;box-shadow:0 14px 32px #0008}
.kr-shell button.kr-action.kr-primary:hover{filter:brightness(1.12);color:#101318;background:var(--menu-accent)}
.kr-pills{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:40px}
.kr-pill{padding:13px 17px;border:1px solid #374454;background:#141d29;color:#cad4e1;font-size:11px;font-weight:800;letter-spacing:.05em}
.kr-motto{margin-top:35px;font-size:10px;font-weight:700;letter-spacing:.22em;color:#79899c}
.kr-overlay{position:fixed;inset:0;background:#000c;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.kr-dialog{width:min(575px,100%);max-height:93vh;overflow-y:auto;background:#151d28;border:1px solid #3b4a5e;border-radius:14px;padding:28px;color:#f4f6fa;box-shadow:0 30px 95px #000d;font-family:"Saira",system-ui,sans-serif}
.kr-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}
.kr-dialog h2{font-family:"Saira Condensed",Impact,sans-serif;font-size:35px;font-style:italic;margin:0}
.kr-overline{color:var(--menu-accent);font-size:11px;letter-spacing:.25em;font-weight:800}
.kr-shell button.kr-close,.kr-dialog button.kr-close{border:1px solid #506078;background:#293545;color:white;border-radius:8px;padding:8px 12px;clip-path:none}
.kr-section-title{font-size:11px;letter-spacing:.2em;font-weight:900;color:#aebdcd;margin-bottom:12px}
.kr-preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

.kr-dialog button.kr-preset:hover{color:white;background:#243041}
.kr-dialog button.kr-preset.chosen{border:2px solid var(--menu-accent);background:#293343}
.kr-swatch{width:16px;height:16px;display:inline-block;border-radius:50%;flex:none}
.kr-rule{height:1px;background:#3a4657;margin:23px 0}
.kr-setting{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:12px 0;font-size:13px}
.kr-setting select,.kr-setting input{max-width:210px;width:auto;margin:0;padding:9px 12px;background:#0e1621;color:#fff;border:1px solid #485970;border-radius:6px;font-size:13px}
.kr-setting input[type=checkbox]{accent-color:var(--menu-accent);width:20px;height:20px}

.kr-compact .kr-top{padding-top:10px;padding-bottom:10px}

.kr-high-contrast{background:#020407}

@media(max-width:650px){.kr-top{padding:15px}.kr-logo{font-size:23px}.kr-mode{padding:7px 9px;font-size:9px}.kr-title{font-size:clamp(61px,15vw,100px)}.kr-intro{font-size:12px;margin:27px auto}.kr-pills{gap:6px;margin-top:28px}.kr-pill{font-size:10px;padding:9px}.kr-dialog{padding:18px}.kr-dialog h2{font-size:29px}}

function krStopFightSim(){krAutoFight=false;if(krAutoHandle!==null){clearTimeout(krAutoHandle);krAutoHandle=null}}
function krFightSimStep(){
 if(!krAutoFight||!F||F.done||view!=="fight"){krStopFightSim();return}
 if(F.cnt){getUp()}else{
  const p=F.p,q=F.q;
  const move=p.st<20?"guard":q.hp<24?"power":p.hp<30?"slip":p.st<40?"jab":(["jab","cross","body","counter","upper"][Math.floor(Math.random()*5)]);
  playRound(move);
 }
 if(!krAutoFight||!F||F.done){krStopFightSim();return}
 krAutoHandle=setTimeout(krFightSimStep,({instant:15,fast:180,normal:650,slow:1400}[krNewSettings.fightSpeed]||650));
}
function krToggleFightSim(){if(krAutoFight){krStopFightSim();render();return}if(!F||F.done)return;krAutoFight=true;krAutoHandle=setTimeout(krFightSimStep,100);render()}
function krFightSimHtml(){if(!F||F.done)return"";return `<div class="card"><div class="row sp"><div><b>${krLocalized("Automatic fight simulation","Simulação automática de luta","Simulación automática de pelea","Simulation automatique du combat","Automatische Kampfsimulation")}</b><p class="mu">${krLocalized("Uses the same combat rules as manual play.","Usa as mesmas regras do combate manual.","Usa las mismas reglas que el combate manual.","Utilise les mêmes règles que le combat manuel.","Nutzt dieselben Kampfregeln wie manuelles Spielen.")}</p></div><button class="pri" onclick="krToggleFightSim()">${krAutoFight?krLocalized("Stop","Parar","Detener","Arrêter","Stoppen"):krLocalized("Simulate","Simular","Simular","Simuler","Simulieren")}</button></div></div>`}

function krChange(key,value){
 const scrollYBefore=window.scrollY;
 krPrefs[key]=value;
 try{localStorage.setItem("kr_menu_prefs",JSON.stringify(krPrefs))}catch(e){}
 render();
 window.scrollTo(0,scrollYBefore);
}

ses a week). Hype raises purse and fame, but also the cost of losing.":"Conférence de presse (−10 énergie, une semaine). Le battage médiatique augmente la bourse et la notoriété, mais rend une défaite plus coûteuse.","Each division has 50 individually generated fighters with their own style, stats, record, age, and signature trait. Your career advances only in your current division.":"Chaque catégorie compte 50 boxeurs uniques, avec leur style, leurs attributs, leur palmarès, leur âge et leur particularité. Votre carrière progresse uniquement dans votre catégorie.","Build a career from the small halls to championship nights. Train smart, develop your style, manage your prime and earn your place in boxing history.":"Des petites salles aux soirées de championnat, entraînez-vous intelligemment, développez votre style, gérez votre apogée et marquez l'histoire de la boxe.","Each organization has its own champion and belt. Win the WBA, WBC, IBF, WBO and Ring Magazine championships separately; collecting all four major sanctioning bodies makes you undisputed.":"Chaque organisation possède son champion et sa ceinture. Remportez séparément les titres WBA, WBC, IBF, WBO et Ring Magazine. Réunir les quatre ceintures majeures fait de vous le champion incontesté.","Your experience remains useful as you age. Physical training gains are strongest before 30; from 32 onward, power, speed and stamina can gradually decline, while defense and fight IQ improve with experience. Nutritionist upgrades slow the decline.":"L'expérience reste précieuse avec l'âge. Les progrès physiques sont plus importants avant 30 ans ; après 32 ans, puissance, vitesse et endurance peuvent décliner, tandis que défense et intelligence du ring progressent. Un nutritionniste ralentit ce déclin.","Jab is fast and cheap. Hook hits hard. Uppercut pressures a high guard. Body shots drain stamina. Slip reduces accuracy; guard reduces damage; clinch smothers attacks and recovers stamina. Counter punishes aggression.  if(!dict || !text || !/[A-Za-z]/.test(text))return text;
 // Case-insensitive lookup supports all-caps game navigation labels.
 return text.replace(KR_I18N_REGEX,(hit)=>{
  const exact=dict[hit]!==undefined?hit:KR_I18N_KEYS.find(k=>k.toLowerCase()===hit.toLowerCase());
  if(!exact)return hit;
  const val=dict[exact];
  return hit===hit.toUpperCase()&&/[A-Z]/.test(hit)?val.toLocaleUpperCase(krPrefs.language):val;
 });
}
function krTranslateGameplay(root){
 if(krPrefs.language==="en" || !root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const targets=[];
 while(walker.nextNode()){
  const node=walker.currentNode, parent=node.parentElement;
  if(!parent || /^(SCRIPT|STYLE|TEXTAREA|OPTION)$/i.test(parent.tagName))continue;
  if(parent.closest("svg, .kr-shell, .kr-ingame-tools, .trait, .offer h4"))continue;
  if(node.nodeValue && /[A-Za-z]/.test(node.nodeValue))targets.push(node);
 }
 targets.forEach(node=>{node.nodeValue=krTranslateText(node.nodeValue)});
 root.querySelectorAll("option, input[placeholder], [title], [aria-label]").forEach(el=>{
  if(el.tagName==="OPTION")el.textContent=krTranslateText(el.textContent);
  for(const a of ["placeholder","title","aria-label"]){
   if(el.hasAttribute(a))el.setAttribute(a,krTranslateText(el.getAttribute(a)));
  }
 });
}
function render(){const a=$("#app");document.body.classList.toggle("kr-at-menu",krMenu);krApplyGamePreferences();
 if(krMenu){a.innerHTML=krMenuHtml()}else{a.innerHTML=(view=="start"?vStart():view=="fight"?vFight():view=="end"?vEnd():vMain())+'<div class="kr-ingame-tools"><button onclick="krGameOptions()">⚙ '+(krT().options)+'</button><button onclick="krBackMenu()">⌂ '+(krPrefs.language==="pt"?"MENU PRINCIPAL":krPrefs.language==="es"?"MENÚ PRINCIPAL":krPrefs.language==="fr"?"MENU PRINCIPAL":krPrefs.language==="de"?"HAUPTMENÜ":"MAIN MENU")+'</button></div>'+(krOptions?'<div class="kr-shell" style="--menu-accent:'+krPrefs.accent+'">'+krSettingsHtml()+'</div>':'')}
 if(!krMenu)krTranslateGameplay(a);
 window.scrollTo(0,0)}
function vStart(){const s=load();return`<div class="hero"><h1>Knockout <span>Road</span></h1><p>Build a career from the small halls to championship nights. Train smart, develop your style, manage your prime and earn your place in boxing history.</p></div>
${hofHtml()}<div class="card" id="bf">${bForm()}</div>${s?`<button onclick="cont()">Continue career</button>`:""}`}

function statPentagon(st,small=false){
 const vals=["pow","spd","sta","def","chin"].map(k=>cl(Number(st&&st[k]||0),0,100));
 const cx=145,cy=126,R=79,angles=[-90,-18,54,126,198];
 const pt=(v,i,r=R)=>{const a=angles[i]*Math.PI/180,rr=r*v/100;return [cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]};
 const polygon=(scale)=>angles.map((a,i)=>{const p=pt(100,i,R*scale);return p.map(n=>n.toFixed(1)).join(",")}).join(" ");
 const data=angles.map((a,i)=>pt(vals[i],i).map(n=>n.toFixed(1)).join(",")).join(" ");
 const labels=["POWER","SPEED","STAMINA","DEFENSE","CHIN"].map((k,i)=>[KR_GAME_I18N[krPrefs.language]?.[k]||k,...[[145,24,"middle"],[264,93,"start"],[218,232,"middle"],[72,232,"middle"],[25,93,"end"]][i]]);
 return `<div class="pentagon-wrap ${small?"mini":""}">
 <svg viewBox="0 0 290 258" role="img" aria-label="Fighter attributes radar chart">
 <polygon points="${polygon(1)}" class="radar-grid outer"/>
 <polygon points="${polygon(.75)}" class="radar-grid"/>
 <polygon points="${polygon(.5)}" class="radar-grid"/>
 <polygon points="${polygon(.25)}" class="radar-grid"/>
 ${angles.map((a,i)=>{const p=pt(100,i);return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" class="radar-axis"/>`}).join("")}
 <polygon points="${data}" class="radar-area"/>
 ${angles.map((a,i)=>{const p=pt(vals[i],i);return `<circle cx="${p[0]}" cy="${p[1]}" r="3.4" class="radar-dot"/>`}).join("")}
 ${labels.map((l,i)=>`<text x="${l[1]}" y="${l[2]}" text-anchor="${l[3]}" class="radar-label" style="font-size:${l[0].length>10?9:11}px">${l[0]}</text>`).join("")}
 </svg><div class="radar-values">${["POW","SPD","STA","DEF","CHN"].map((k,i)=>`<span><b>${KR_GAME_I18N[krPrefs.language]?.[k]||k}</b> ${vals[i]}</span>`).join("")}</div>
 </div>`;
}

function head(){
 const r=50-Math.min(G.lad,50)+1;
 return `<div class="card fighter-overview">
 <div class="fighter-top"><div class="fighter-id"><div class="clk" role="button" tabindex="0" title="View profile" onclick="showP('me')">${face(G.face,76)}</div><div><div class="eyebrow">FIGHTER PROFILE · ${WC[G.wc][0].toUpperCase()}</div><h2>${G.name}</h2><span class="mu">${G.nick?"“"+G.nick+"” · ":""}${G.wt} lb · ${G.h} cm · reach ${G.r} cm</span><div class="fighter-tags"><span class="chip">${G.lad>=50?"Champion":"Rank #"+r}</span><span class="chip">Age ${G.age}</span><span class="chip">${G.sty}</span></div></div></div>
 <div class="fighter-meta"><span class="chip">${$$(G.cash)}</span><span class="chip">Fame ${G.fame}</span><span class="chip">Level ${G.level||1}</span><span class="chip">${G.w}-${G.l}-${G.d} · ${G.ko} KO</span>${G.belts.map(b=>`<span class="belt">${b}</span>`).join("")}${(G.orgBelts||[]).map(b=>`<span class="belt">${b}</span>`).join("")}</div></div>
 <div class="fighter-stats-layout"><div class="pentagon-panel"><div class="subhead"><h3>Fighter attributes</h3><span class="mu">5-attribute profile</span></div>${statPentagon(G.st)}</div>
 <div class="attribute-bars"><div class="subhead"><h3>Condition</h3><span class="mu">Current week</span></div><div class="stat"><span>Energy</span>${bar(G.energy,100,"g")}<span>${G.energy}</span></div>${G.inj?`<p class="mu">Injured: ${G.inj} week(s) until you can train or fight.</p>`:""}${Object.keys(SN).map(k=>`<div class="stat"><span>${SN[k]}</span>${bar(G.st[k],99)}<span>${G.st[k]}</span></div>`).join("")}</div></div>
 </div>`;
}
function vMain(){if(G.ev!=null)return head()+evCard();const T=[["train","Training"],["fights","Fights"],["world","Boxing world"],["sp","Sponsors"],["up","Upgrades"],["perks","Skills"],["log","Career"]];
 return head()+progressHtml()+(msg?`<div class="msg">${msg}</div>`:"")+`<div class="tabs">${T.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("")}</div>`+({train:tTrain,fights:tFights,world:tWorld,sp:tSp,up:tUp,log:tLog,perks:()=>skillTree()+tPerks()}[tab]||tWorld)()}
function tTrain(){const d=G.inj>0;return`<div class="card"><h3>This week</h3><p class="mu">Each action uses one week. Training costs 20 energy.</p><div class="row">${Object.keys(SN).map(k=>`<button ${d||G.energy<20?"disabled":""} onclick="trainGame('${k}')">Train ${SN[k].toLowerCase()}</button>`).join("")}</div></div>
<div class="card"><div class="row"><button ${d||G.energy<25?"disabled":""} onclick="act('spar')">Sparring (-25 energy)</button>${(()=>{const o=nextOpp(),n=G.camp&&G.camp.key==o.key?G.camp.n:0;return`<button ${G.inj>0||G.energy<25||n>=3?"disabled":""} onclick="camp()">Fight camp vs ${o.name} (${n}/3, -25 energy)</button>`})()}<button ${G.energy<10?"disabled":""} onclick="act('promo')">Promote yourself (+fame)</button><button ${G.energy<15?"disabled":""} onclick="act('job')">Take a shift (cash)</button><button onclick="act('rest')">Rest and recover</button></div></div>`}
let rankView=3;
function rankingRows(c){const arr=(G.rankings&&G.rankings[c])||(c===G.wc?rk():OPP);let rows=arr.map((d,i)=>({rank:50-i,name:d[0],town:d[2]||"International",status:c===G.wc?((G.defeatedRankings||[]).includes(i)?"Defeated":"Ranked contender"):"Ranked contender",profile:d[3]}));if(c===G.wc)rows.push({rank:51-G.lad,name:G.name+(G.nick?` “${G.nick}”`:""),town:G.town||"Your gym",status:"YOU · "+careerTier().name,player:true});rows.sort((a,b)=>a.rank-b.rank);return rows.map(r=>`<tr class="${r.player?"next":""}"><td>#${r.rank}</td><td><b>${r.name}</b>${r.profile?`<br><span class="mu">${r.profile.style} · ${r.profile.trait}</span>`:""}</td><td>${r.town||"Your gym"}</td><td>${r.status}</td></tr>`).join("")}
function tFights(){const offers=fightOffers(),can=G.inj==0&&G.energy>=35;
 return`<div class="card"><div class="subhead"><h3>Fight offers</h3><span class="chip">${WC[G.wc][0]} · ${G.lad<50?"Rank "+(51-G.lad)+" / 50":"Champion"}</span></div><p class="mu">Choose one of three opponents near your current standing. Higher-ranked opponents pay more and can move you up faster; lower-ranked opponents are safer tune-ups. Offers refresh when you take an action that advances the week.</p><div class="offer-grid">${offers.map(o=>`<div class="offer"><div class="mu">${o.def?"TITLE DEFENSE":o.title?o.title.toUpperCase()+" RANKING BOUT":"RANKING BOUT"} ${o.rankIndex!=null?"· #"+(50-o.rankIndex):""}</div><h4>${o.name}</h4><div class="mu">${o.nick?"“"+o.nick+"” · ":""}${o.town||"International"}</div><p><span class="trait">${o.sty}</span> <span class="trait">${o.trait||"Veteran"}</span> <span class="trait">${o.personality||"Focused"}</span></p><p class="mu">${o.traitDesc||"Experienced professional with a distinct tactical approach."}</p><p class="mu">Age ${o.age} · Record ${o.w}-${o.l} · ${o.ko} KOs</p><p class="mu">Power ${o.st.pow} · Speed ${o.st.spd} · Stamina ${o.st.sta}<br>Defense ${o.st.def} · Chin ${o.st.chin}</p><p><b>${$$(o.purse)}</b> purse · +${o.fame} fame</p><p class="mu">${G.fame<o.req?"Requires "+o.req+" fame":"Ready to fight"}</p><button class="pri" ${can&&G.fame>=o.req?"":"disabled"} onclick="startFight('offer','${o.offerId}')">Accept offer</button></div>`).join("")}</div><div class="row" style="margin-top:12px"><button onclick="refreshOffers()">Refresh offers</button><button ${can?"":"disabled"} onclick="startFight('tune')">Take a tune-up bout</button></div>${can?"":`<p class="mu">You need 35+ energy and no injury to fight.</p>`}<p class="mu">Press conference (-10 energy, uses a week). Hype raises purse and fame, but also the cost of losing.</p><div class="row"><button ${G.inj>0||G.energy<10?"disabled":""} onclick="press('humble')">Stay humble</button><button ${G.inj>0||G.energy<10||G.cash<300?"disabled":""} onclick="press('stunt')">Sponsor stunt ($300)</button><button ${G.inj>0||G.energy<10?"disabled":""} onclick="press('trash')">Trash talk</button></div></div>
<div class="card"><div class="subhead"><h3>Division rankings</h3><span class="chip">50 fighters · ${WC[G.wc][0]}</span></div><label>View weight class<select id="rankClass" onchange="rankView=+this.value;render()">${WC.map((w,i)=>`<option value="${i}" ${i==rankView?"selected":""}>${w[0]}</option>`).join("")}</select></label><div class="table-wrap"><table><thead><tr><th>Rank</th><th>Boxer</th><th>From</th><th>Status</th></tr></thead><tbody>${rankingRows(rankView)}</tbody></table></div><p class="mu">Each division has 50 individually generated fighters with their own style, stats, record, age, and signature trait. Your career advances only in your current division.</p>${(G.news||[]).map(n=>`<p class="mu">${n}</p>`).join("")}</div>`}
function tSp(){const slots=Math.min(4,1+Math.floor(G.fame/25));return`<div class="card"><h3>Sponsors (${G.sp.length}/${slots} slots)</h3><p class="mu">Weekly pay plus a bonus on every win. More slots unlock with fame. Two losses in a row cost you a deal.</p>
${G.sp.map(s=>`<p><b>${s.n}</b> · ${$$(s.wk)}/wk · ${$$(s.win)} per win · ${s.left} wks left</p>`).join("")||`<p class="mu">No active deals.</p>`}</div>
<div class="card"><h3>Offers</h3>${SPN.map((s,i)=>{const has=G.sp.some(x=>x.n==s.n),ok=G.fame>=s.fame&&G.sp.length<slots&&!has;return`<div class="row sp" style="margin:6px 0"><span><b>${s.n}</b><br><span class="mu">${$$(s.wk)}/wk · ${$$(s.win)}/win · fame ${s.fame}</span></span><button ${ok?"":"disabled"} onclick="sign(${i})">${has?"Signed":"Sign"}</button></div>`}).join("")}</div>`}
function tUp(){return`<div class="card"><h3>Upgrades</h3>${Object.keys(UP).map(k=>{const u=UP[k],lv=G.up[k],c=u[2]*Math.pow(3,lv);return`<div class="row sp" style="margin:8px 0"><span><b>${u[0]}</b> level ${lv}/4<br><span class="mu">${u[1]}</span></span><button ${lv>=4||G.cash<c?"disabled":""} onclick="buy('${k}')">${lv>=4?"Maxed":"Buy "+$$(c)}</button></div>`}).join("")}<p class="mu">Gym fees rise ${$$(30)} per gym level each week.</p></div>`}
function tLog(){return`<div class="card"><h3>Career record</h3><p class="mu">Level ${G.level||1} · ${G.xp||0} total XP · ${levelTitle(G.level||1)} · Skills: ${Object.entries(BRANCHES).map(([k,b])=>b.name+" "+branchVal(k)+"/5").join(" · ")}</p><div class="row"><span class="chip">Wins ${G.w}</span><span class="chip">Losses ${G.l}</span><span class="chip">Draws ${G.d}</span><span class="chip">KO rate ${G.w?Math.round(G.ko/G.w*100):0}%</span><span class="chip">Title defenses ${G.defs}</span></div><p>Career stage: <b>${careerTier().name}</b>. Total XP: ${G.xp||0}. Next milestone: ${careerTier().next}.</p></div><div class="card"><h3>Career log</h3><div class="log" style="max-height:300px">${G.log.map(l=>`<p>${l}</p>`).join("")}</div></div><div class="row"><button onclick="retire()">Retire</button><button onclick="reset()">New career</button></div>`}
function fighter(n,sub,f,c,fc){return`<div><div class="clk" role="button" tabindex="0" title="View profile" onclick="showP('${fc===G.face?"me":"opp"}')">${face(fc,72)}<span class="mu">View profile</span></div><h3>${n}</h3><div class="mu">${sub}</div><div class="stat" style="grid-template-columns:40px 1fr 30px"><span>Health</span>${bar(Math.max(0,f.hp),100,c)}<span>${Math.max(0,Math.round(f.hp))}</span></div><div class="stat" style="grid-template-columns:40px 1fr 30px"><span>Gas</span>${bar(f.st,100,"g")}<span>${Math.round(f.st)}</span></div><div class="mu">Knockdowns: ${f.kd}</div></div>`}
function vFight(){const o=F.o;return krFightSimHtml()+`<div class="card"><h2>${o.title?o.title+" title fight":"Fight night"}</h2><p class="mu">Round ${Math.min(F.rd,o.rounds)} of ${o.rounds} · exchange ${F.ex+1} of 3</p><div class="vs">${fighter(G.name,"You",F.p,"",G.face)}${fighter(o.name,WC[G.wc][0]+" · level "+o.L,F.q,"r",o.face)}</div></div>
<div class="card"><div class="log">${F.lg.map(l=>`<p>${l}</p>`).join("")}</div></div>
${F.done?`<button class="pri" onclick="leave()">Back to the gym</button>`:F.cnt?`<div class="card"><h3>Down! The referee is counting</h3><p style="font-size:2.4rem;margin:4px 0"><b id="cnt">${F.cnt}</b></p><button class="pri" onclick="getUp()">Get up</button><p class="mu">Rise later for better odds, but at ten you are out. A failed attempt costs you two counts.</p></div>`:`<div class="card">${F.ex==0&&F.rd>1&&F.cr>0&&F.cuR!=F.rd?`<p><b>Corner advice</b> <span class="mu">(${F.cr} left, one per round)</span></p><div class="row"><button onclick="corner('rest')">Rest up</button><button onclick="corner('stitch')">Patch cuts</button><button onclick="corner('fire')">Fire up</button><button onclick="corner('sharp')">Stay sharp</button></div>`:""}<p><b>Punches</b></p><div class="row">${["jab","cross","power","upper","body"].map(mv).join("")}</div><p><b>Defense</b></p><div class="row">${["slip","guard","clinch"].map(mv).join("")}</div><p><b>Tactics</b></p><div class="row">${["counter","allout"].map(mv).join("")}<button onclick="simRound()">Auto-finish round</button></div><p class="mu">Jab is fast and cheap. Hook hits hard. Uppercut pressures a high guard. Body shots drain stamina. Slip reduces accuracy; guard reduces damage; clinch smothers attacks and recovers stamina. Counter punishes aggression. All-out can swing a fight but leaves you open. Different punch types can trigger a short combination bonus. Each round is three exchanges.</p><div class="style-info"><b>Your style: ${G.sty}</b><br>${(STYLE_INFO[G.sty]||STYLE_INFO.Boxer).summary}<br><span class="mu">Strength: ${(STYLE_INFO[G.sty]||STYLE_INFO.Boxer).strength} Weakness: ${(STYLE_INFO[G.sty]||STYLE_INFO.Boxer).weakness}</span></div><p><button onclick="towel()">Throw in the towel</button></p></div>`}`}
function vEnd(){const sc=G.w*10+G.ko*5+G.fame+(G.belts.length+(G.orgBelts||[]).length)*100+G.defs*30,rk=sc>700?"Boxing legend":sc>400?"World class champion":sc>200?"Respected contender":sc>80?"Solid pro":"Journeyman";
 return`<div class="hero"><h1>Career <span>over</span></h1><p>${G.name} retired at ${G.age} after ${G.week} weeks.</p></div><div class="card"><h2>${rk}</h2><p>Record ${G.w}-${G.l}-${G.d} with ${G.ko} knockouts. Fame ${G.fame}. Earnings on hand ${$$(G.cash)}.</p><p>${G.belts.length?G.belts.map(b=>`<span class="belt">${b}</span>`).join(" ")+" · "+G.defs+" title defenses":"No belts won."}</p><p class="mu">Legacy score ${sc} · Career level ${G.level||1} · ${G.xp||0} XP · saved to the Hall of Fame</p><p>Best achievement: ${careerTier().name}. ${G.defs?`Title defenses: ${G.defs}.`:""}</p><button class="pri" onclick="reset()">Start a new career</button></div>`}
render();
</script></body></html>
